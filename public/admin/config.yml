# Decap CMS configuration — P1 foundation scaffold.
# Auth route: direct GitHub backend + Netlify OAuth Provider Tokens (DECISIONS.md D-01b).
# Netlify Identity and Git Gateway are both officially deprecated — deliberately NOT used here.

backend:
  name: github
  repo: TwanFlorisRieksen/LeonardRieksenFotografie
  branch: main

# Decap's config schema requires a root-level media_folder/public_folder even though the only
# current collection overrides both to "" for colocation (found via live browser validation —
# Decap rejects the config without this). Serves only as the unused default for any future
# collection that doesn't set its own.
media_folder: "src/assets/uploads"
public_folder: "/uploads"

# 12.93-12.95: workflow should match how Leo actually works. He publishes largely alone, so the
# simplified/default publish mode is used now; editorial_workflow (draft/review branches+PRs) is a
# CMS-08 decision explicitly deferred to P5, not enabled here.
publish_mode: simple

# 12.90: unpublished work is represented in-model via the `draft` field per entry (see below),
# not via Decap's own branch-based workflow states (that's what editorial_workflow would add later).

collections:
  - name: "projects"
    label: "Projecten"
    label_singular: "Project"
    folder: "src/content/projects"
    create: true
    delete: true
    # One subfolder per entry (index.md + colocated images) — matches content.config.ts's loader and
    # keeps Decap's uploaded-media path identical to the relative path Astro's image() helper expects.
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - label: "Categorie"
        name: "category"
        widget: "select"
        options:
          - { label: "Architectuur", value: "architectuur" }
          - { label: "Interieur", value: "interieur" }
      - label: "Locatie (optioneel)"
        name: "location"
        widget: "string"
        required: false
        hint: "Alleen invullen als de plaats echt bekend is — nooit raden."
      - label: "Jaar (optioneel)"
        name: "year"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Alleen invullen als het opnamejaar echt bekend is — nooit raden."
      - { label: "Samenvatting", name: "summary", widget: "text" }
      - { label: "Coverbeeld", name: "coverImage", widget: "image" }
      - label: "Alt-tekst coverbeeld"
        name: "coverImageAlt"
        widget: "string"
        hint: "Beschrijf wat er te zien is — niet de bestandsnaam herhalen."
      - label: "Galerij"
        name: "gallery"
        widget: "list"
        fields:
          - { label: "Afbeelding", name: "image", widget: "image" }
          - label: "Alt-tekst"
            name: "alt"
            widget: "string"
            hint: "Beschrijf wat er te zien is — niet de bestandsnaam herhalen."
          - { label: "Bijschrift (optioneel)", name: "caption", widget: "string", required: false }
      - { label: "Uitgelicht", name: "featured", widget: "boolean", default: false }
      - label: "Openingsopmaak"
        name: "leadLayout"
        widget: "select"
        default: "cinematic"
        hint: "Bepaalt hoe de projectpagina opent — kies wat bij de fotografie past."
        options:
          - { label: "Filmisch (grote beeldopening, titel eronder)", value: "cinematic" }
          - { label: "Redactioneel (titel + tekst eerst, dan beeld)", value: "editorial" }
          - { label: "Diptiek (twee beelden naast elkaar bovenaan)", value: "duo-lead" }
      - label: "Volgorde"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 0
        hint: "Bepaalt de volgorde op het portfolio-overzicht (laag = eerst)."
      - label: "Concept (nog niet publiceren)"
        name: "draft"
        widget: "boolean"
        default: true
        hint: "Aanvinken uit = zichtbaar op de live website."
      - label: "SEO-titel (optioneel)"
        name: "seoTitle"
        widget: "string"
        required: false
        hint: "Leeg laten gebruikt automatisch de titel hierboven."
      - label: "SEO-omschrijving (optioneel)"
        name: "seoDescription"
        widget: "text"
        required: false
        hint: "Leeg laten gebruikt automatisch de samenvatting hierboven."
      - label: "Social share-afbeelding (optioneel)"
        name: "socialImage"
        widget: "image"
        required: false
        hint: "Leeg laten gebruikt automatisch het coverbeeld hierboven."

  # Standalone portfolio works (P6 recovery — D-34): the images that don't belong to a multi-image
  # project, published as one curated set on the portfolio exhibition. Edited as a single JSON file with
  # a list field; images colocate next to it (same media path Astro's image() helper resolves).
  - name: "works"
    label: "Losse portfoliowerken"
    files:
      - name: "works"
        label: "Losse werken"
        file: "src/content/portfolio/works.json"
        media_folder: ""
        public_folder: ""
        fields:
          - label: "Werken"
            name: "works"
            widget: "list"
            summary: "{{fields.id}} — {{fields.category}}"
            fields:
              - { label: "ID (map-/bestandsnaam)", name: "id", widget: "string", hint: "Korte kebab-case naam; komt overeen met de afbeelding." }
              - { label: "Afbeelding", name: "image", widget: "image" }
              - label: "Categorie"
                name: "category"
                widget: "select"
                options:
                  - { label: "Architectuur", value: "architectuur" }
                  - { label: "Interieur", value: "interieur" }
              - label: "Prominentie"
                name: "scale"
                widget: "select"
                default: "standard"
                hint: "Bepaalt hoe prominent het beeld in de reeks valt."
                options:
                  - { label: "Statement (volle breedte)", value: "feature" }
                  - { label: "Standaard", value: "standard" }
                  - { label: "Rustpunt (klein)", value: "quiet" }
              - label: "Alt-tekst"
                name: "alt"
                widget: "string"
                hint: "Beschrijf wat er te zien is — niet de bestandsnaam herhalen."
              - { label: "Bijschrift (optioneel)", name: "caption", widget: "string", required: false }
              - label: "Locatie (optioneel)"
                name: "location"
                widget: "string"
                required: false
                hint: "Alleen invullen als de plaats echt bekend is — nooit raden."
              - label: "Jaar (optioneel)"
                name: "year"
                widget: "number"
                value_type: "int"
                required: false
                hint: "Alleen invullen als het opnamejaar echt bekend is — nooit raden."
